name: Upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pin latest Swiftgram
        id: bump
        run: |
          python -m Tools.ecogram bump
          git diff --quiet upstream.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Apply patches
        if: steps.bump.outputs.changed == 'true'
        id: apply
        continue-on-error: true
        run: python -m Tools.ecogram sync

      - name: Commit update
        if: steps.bump.outputs.changed == 'true' && steps.apply.outcome == 'success'
        run: |
          commit="$(python -c 'import json; print(json.load(open("upstream.json"))["commit"][:10])')"
          git config user.name "ecoGram"
          git config user.email "build@ecogram.app"
          git commit -am "chore: sync Swiftgram $commit"
          git push

      - name: Report conflict
        if: steps.bump.outputs.changed == 'true' && steps.apply.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(python -c 'import json; print(json.load(open("upstream.json"))["commit"])')"
          title="Patches do not apply to Swiftgram ${commit:0:10}"
          gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -qx 0 || exit 0
          gh issue create --title "$title" --body "Run \`python -m Tools.ecogram sync\` locally, resolve the conflicting patch and \`python -m Tools.ecogram export\`. Upstream commit: $commit"
